name: Build lk2nd for ReadBoy G35S

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: lk2nd-msm8916
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            device-tree-compiler \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          dtc --version

      - name: Clone lk2nd upstream
        run: git clone --depth=1 https://github.com/msm8916-mainline/lk2nd.git

      - name: Inject ReadBoy G35S device tree
        run: |
          DTS_DIR="lk2nd/lk2nd/device/dts/msm8916"
          cp helper/device/msm8916-readboy-g35s.dts "$DTS_DIR/"
          printf '\nQCDTBS += \\\n\t$(LOCAL_DIR)/msm8916-readboy-g35s.dtb \\\n' >> "$DTS_DIR/rules.mk"
          echo "--- tail of rules.mk ---"
          tail -6 "$DTS_DIR/rules.mk"
          echo "--- device dts ---"
          ls -l "$DTS_DIR/msm8916-readboy-g35s.dts"

      - name: Build lk2nd
        working-directory: lk2nd
        run: make -j"$(nproc)" TOOLCHAIN_PREFIX=arm-none-eabi- lk2nd-msm8916

      - name: Inspect artifact
        run: |
          ls -lh lk2nd/build-lk2nd-msm8916/ || true
          IMG=lk2nd/build-lk2nd-msm8916/lk2nd.img
          if [ ! -f "$IMG" ]; then
            echo "::error::lk2nd.img was not produced"
            exit 1
          fi
          echo "lk2nd.img size: $(stat -c%s "$IMG") bytes"
          python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(); ks,_,rs,_,ss,_,_,pg=struct.unpack_from('<IIIIIIII',d,8); print('magic',d[:8],'kernel',ks,'ramdisk',rs,'page',pg,'total',len(d))" "$IMG"

      - name: Upload lk2nd.img
        uses: actions/upload-artifact@v4
        with:
          name: lk2nd-msm8916-readboy-g35s
          path: lk2nd/build-lk2nd-msm8916/lk2nd.img
          if-no-files-found: error
