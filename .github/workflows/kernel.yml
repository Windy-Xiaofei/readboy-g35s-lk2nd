name: Build mainline kernel for ReadBoy G35S

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  kernel:
    name: kernel-msm8916
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            build-essential \
            gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev \
            device-tree-compiler \
            cpio busybox-static
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download msm8916-mainline kernel
        run: |
          set -e
          echo "download tarball (git clone of a full kernel tree is unreliable here)"
          curl -L --retry 5 --retry-delay 5 --retry-all-errors \
            -o linux.tar.gz \
            https://github.com/msm8916-mainline/linux/archive/refs/heads/master.tar.gz
          ls -lh linux.tar.gz
          mkdir -p linux
          tar -xzf linux.tar.gz -C linux --strip-components=1
          rm -f linux.tar.gz
          test -f linux/Makefile
          echo "--- kernel version ---"
          head -5 linux/Makefile
          df -h .

      - name: Inject device tree
        run: |
          DTS_DIR=linux/arch/arm64/boot/dts/qcom
          cp helper/device/kernel/msm8916-readboy-g35s.dts "$DTS_DIR/"
          printf 'dtb-$(CONFIG_ARCH_QCOM)\t+= msm8916-readboy-g35s.dtb\n' >> "$DTS_DIR/Makefile"
          echo "--- tail of dts Makefile ---"
          tail -4 "$DTS_DIR/Makefile"

      - name: Configure kernel
        working-directory: linux
        run: make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- msm8916_defconfig

      # msm8916_defconfig builds the UDC driver but not the configfs gadget
      # glue, so an initramfs cannot create any USB gadget and the device
      # stays invisible on the host. Needed for the boot smoke test.
      - name: Enable USB gadget configfs
        working-directory: linux
        run: |
          ./scripts/config -e USB_CONFIGFS -e USB_CONFIGFS_ACM -e USB_LIBCOMPOSITE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "--- gadget config ---"
          grep -E "CONFIG_USB_CONFIGFS=|CONFIG_CONFIGFS_FS=|CONFIG_USB_GADGET=" .config

      - name: Build kernel and dtbs
        working-directory: linux
        run: |
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs
          ls -lh arch/arm64/boot/Image
          ls -lh arch/arm64/boot/dts/qcom/msm8916-readboy-g35s.dtb

      - name: Build test initramfs
        run: |
          set -e
          # resolve symlinks: /usr/bin/busybox is a link to the real static binary
          BB="$(readlink -f "$(command -v busybox || echo /bin/busybox)")"
          echo "busybox: $BB"
          ls -l "$BB"
          mkdir -p rootfs/bin rootfs/sbin rootfs/proc rootfs/sys rootfs/dev rootfs/tmp
          cp -L "$BB" rootfs/bin/busybox
          chmod +x rootfs/bin/busybox
          SZ="$(stat -c%s rootfs/bin/busybox)"
          echo "busybox size after copy: $SZ"
          if [ "$SZ" -lt 300000 ]; then
            echo "::error::busybox was not copied as a real file (got $SZ bytes)"
            exit 1
          fi
          # create applet symlinks, but never touch busybox itself
          for app in $(rootfs/bin/busybox --list); do
            [ "$app" = "busybox" ] && continue
            ln -sf busybox "rootfs/bin/$app" 2>/dev/null || true
          done
          cp helper/device/init rootfs/init
          chmod +x rootfs/init
          ( cd rootfs && find . | cpio -o -H newc --quiet | gzip -9 ) > initramfs.cpio.gz
          ls -lh initramfs.cpio.gz
          SZ2="$(stat -c%s initramfs.cpio.gz)"
          echo "initramfs size: $SZ2"
          if [ "$SZ2" -lt 200000 ]; then
            echo "::error::initramfs suspiciously small, busybox likely missing"
            exit 1
          fi
          echo "--- bin/busybox entry in archive ---"
          ( cd rootfs && find ./bin -maxdepth 1 -name busybox -exec ls -l {} \; )

      - name: Package boot image
        run: |
          python3 helper/device/mkbootimg.py \
            --kernel linux/arch/arm64/boot/Image \
            --ramdisk initramfs.cpio.gz \
            --dtb linux/arch/arm64/boot/dts/qcom/msm8916-readboy-g35s.dtb \
            --out boot-mainline-g35s.img \
            --name "readboy-g35s" \
            --cmdline "console=ttyMSM0,115200 quiet"
          ls -lh boot-mainline-g35s.img
          python3 -c "import struct,sys; d=open('boot-mainline-g35s.img','rb').read(); ks,_,rs,_,ss,_,_,pg=struct.unpack_from('<IIIIIIII',d,8); dt=struct.unpack_from('<I',d,40)[0]; print('kernel',ks,'ramdisk',rs,'dtb',dt,'page',pg,'total',len(d)); sys.exit(0 if rs>200000 else 1)" \
            || { echo '::error::ramdisk in boot image is too small (busybox missing)'; exit 1; }

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: mainline-g35s-boot
          path: |
            boot-mainline-g35s.img
            linux/arch/arm64/boot/Image
            linux/arch/arm64/boot/dts/qcom/msm8916-readboy-g35s.dtb
          if-no-files-found: error
